<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f2; --ink:#14221c; --muted:#5b6b63; --line:#d5dcd6;
  --ok:#0b8a5f; --bad:#c23b3b; --warn:#b7791f; --accent:#0b8a5f;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1714; --ink:#e6efe9; --muted:#8fa399; --line:#25352e; --ok:#3fd49a; --bad:#ff7a7a; --warn:#f0b955; --accent:#3fd49a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.95rem}
header b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--muted);margin-right:.5em}
.on .dot{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.off .dot{background:var(--bad)}
.stale .dot{background:var(--warn)}
@keyframes pulse{70%{box-shadow:0 0 0 .6em transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{font-size:clamp(2.6rem,10vw,5.2rem);line-height:1;letter-spacing:-.03em;font-weight:800;margin:clamp(28px,6vw,56px) 0 8px}
.on h1{color:var(--ok)} .off h1{color:var(--bad)} .stale h1{color:var(--warn)}
.sub{color:var(--muted);margin:0 0 28px;font-size:1.05rem}
.pulse{border-block:1px solid var(--line);padding:14px 0 6px}
.pulse svg{display:block;width:100%;height:96px}
.pulse path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.pulse .area{fill:var(--accent);opacity:.08;stroke:none}
.pulse p{display:flex;justify-content:space-between;margin:6px 0 0;font-size:.85rem;color:var(--muted)}
dl{margin:28px 0 0;display:grid;grid-template-columns:1fr auto;gap:0}
dt,dd{margin:0;padding:14px 0;border-bottom:1px solid var(--line)}
dt{color:var(--muted)}
dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
footer{margin-top:24px;color:var(--muted);font-size:.85rem}
#err{color:var(--bad);margin-top:12px;font-size:.9rem}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dot{animation:none!important}}
</style>
</head>
<body>
<main id="root" class="stale">
  <header>
    <span><span class="dot"></span><b id="name">Bot</b></span>
    <span id="clock"></span>
  </header>

  <h1 id="state">Memuat…</h1>
  <p class="sub" id="sub">Mengambil data terbaru.</p>

  <section class="pulse" aria-label="Riwayat ping">
    <svg id="chart" viewBox="0 0 600 96" preserveAspectRatio="none" role="img" aria-label="Grafik ping">
      <path class="area" id="area"/><path id="line"/>
    </svg>
    <p><span>Riwayat ping</span><span id="range">–</span></p>
  </section>

  <dl>
    <dt>Ping</dt><dd id="ping">–</dd>
    <dt>Server</dt><dd id="guilds">–</dd>
    <dt>Pengguna</dt><dd id="users">–</dd>
    <dt>Memori</dt><dd id="mem">–</dd>
    <dt>Update terakhir</dt><dd id="updated">–</dd>
  </dl>
  <div id="err" role="status"></div>
  <footer id="foot"></footer>
</main>

<script>
/* ============ PENGATURAN (ubah di sini) ============ */
const CONFIG = {
  // URL JSON status bot. Kosongkan = mode demo (data palsu).
  // Contoh Gist : "https://gist.githubusercontent.com/USER/ID/raw/status.json"
  // Contoh Supabase: "https://XXXX.supabase.co/rest/v1/bot_status?select=*&order=updated_at.desc&limit=1"
  DATA_URL: "https://kgupwuinbzlehopvvntu.supabase.co/rest/v1/bot_status?select=*&id=eq.1",
  // Header tambahan. Untuk Supabase isi anon key (aman dipublish, JANGAN service key).
  HEADERS: { apikey: "sb_publishable_It2zKEHriV_E_tDAUFoG4Q_gKU_tSRu" },
  REFRESH_MS: 10000,      // seberapa sering halaman cek data
  OFFLINE_AFTER_S: 90     // kalau data lebih tua dari ini → dianggap offline
};
/* Format JSON yang dibaca:
{ "name":"NamaBot", "startedAt":1700000000000, "ping":42,
  "guilds":12, "users":3400, "memoryMb":118, "updatedAt":1700000500000 }
  (waktu dalam milidetik; Supabase boleh pakai updated_at / started_at / memory_mb) */

const $ = id => document.getElementById(id);
const fmt = n => (n ?? "–") === "–" ? "–" : Number(n).toLocaleString("id-ID");
let history = [];
try { history = JSON.parse(localStorage.getItem("pingHistory") || "[]"); } catch (e) {}

function ago(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if (s < 5) return "baru saja";
  if (s < 60) return s + " detik lalu";
  if (s < 3600) return Math.floor(s/60) + " menit lalu";
  return Math.floor(s/3600) + " jam lalu";
}
function dur(ms){
  const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return (d ? d + " hari " : "") + (h || d ? h + " jam " : "") + m + " menit";
}
function normalize(r){
  if (Array.isArray(r)) r = r[0] || {};
  const t = v => v == null ? null : (typeof v === "number" ? v : Date.parse(v));
  return {
    name: r.name, ping: r.ping, guilds: r.guilds, users: r.users,
    memoryMb: r.memoryMb ?? r.memory_mb,
    startedAt: t(r.startedAt ?? r.started_at),
    updatedAt: t(r.updatedAt ?? r.updated_at)
  };
}
function demo(){
  const now = Date.now();
  return { name:"Bot Demo", ping: 38 + Math.round(Math.random()*40), guilds:12, users:3482,
           memoryMb: 112 + Math.round(Math.random()*10), startedAt: now - 3*86400e3 - 4*3600e3, updatedAt: now };
}
function setState(cls, title, sub){
  $("root").className = cls; $("state").textContent = title; $("sub").textContent = sub;
}
function drawChart(){
  const pts = history.slice(-60);
  if (pts.length < 2){ $("line").setAttribute("d",""); $("area").setAttribute("d",""); $("range").textContent = "Menunggu data…"; return; }
  const vals = pts.map(p => p.v), max = Math.max(...vals, 50), min = Math.min(...vals, 0);
  const x = i => (i/(pts.length-1))*600, y = v => 86 - ((v-min)/(max-min||1))*76;
  const d = pts.map((p,i) => (i?"L":"M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  $("line").setAttribute("d", d);
  $("area").setAttribute("d", d + " L600 96 L0 96 Z");
  $("range").textContent = "terendah " + Math.min(...vals) + " ms · tertinggi " + Math.max(...vals) + " ms";
}
function render(b, fetchFailed){
  $("name").textContent = b.name || "Bot";
  document.title = (b.name || "Bot") + " – Status";
  $("ping").textContent = b.ping != null ? b.ping + " ms" : "–";
  $("guilds").textContent = fmt(b.guilds);
  $("users").textContent = fmt(b.users);
  $("mem").textContent = b.memoryMb != null ? b.memoryMb + " MB" : "–";
  const age = b.updatedAt ? Date.now() - b.updatedAt : Infinity;
  $("updated").textContent = b.updatedAt ? ago(age) : "–";
  if (age > CONFIG.OFFLINE_AFTER_S*1000){
    setState("off", "Offline", b.updatedAt ? "Terakhir terlihat " + ago(age) + "." : "Belum ada data dari bot.");
  } else {
    setState("on", "Online", b.startedAt ? "Sudah menyala " + dur(Date.now() - b.startedAt) + "." : "Bot aktif.");
    if (b.ping != null && b.updatedAt && !history.some(p => p.t === b.updatedAt)){
      history.push({t:b.updatedAt, v:b.ping}); history = history.slice(-120);
      try { localStorage.setItem("pingHistory", JSON.stringify(history)); } catch (e) {}
    }
  }
  drawChart();
}
let last = {};
async function load(){
  try {
    if (!CONFIG.DATA_URL){ last = demo(); $("foot").textContent = "Mode demo: isi CONFIG.DATA_URL di index.html untuk data asli."; }
    else {
      const res = await fetch(CONFIG.DATA_URL, { headers: CONFIG.HEADERS, cache:"no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      last = normalize(await res.json());
    }
    $("err").textContent = "";
  } catch (e) {
    $("err").textContent = "Gagal mengambil data (" + e.message + "). Menampilkan data terakhir.";
  }
  render(last);
}
setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString("id-ID"); }, 1000);
setInterval(() => render(last), 1000);
load(); setInterval(load, CONFIG.REFRESH_MS);
</script>
</body>
</html>
