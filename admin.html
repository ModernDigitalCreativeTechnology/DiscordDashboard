<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--ink:#14221c;--muted:#5b6b63;--line:#d5dcd6;--ok:#0b8a5f;--bad:#c23b3b;--accent:#0b8a5f;--onaccent:#fff;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1714;--ink:#e6efe9;--muted:#8fa399;--line:#25352e;--ok:#3fd49a;--bad:#ff7a7a;--accent:#3fd49a;--onaccent:#08130e}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px)}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px}
nav{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;color:var(--muted);margin-bottom:32px}
label{display:block;font-weight:600;margin:20px 0 6px}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 0;font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{
  width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:200px;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:14px 0}
.row label{margin:0}
.row input{width:22px;height:22px;accent-color:var(--accent)}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);padding:10px 20px;margin-top:24px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);margin:0;padding:6px 14px}
button:disabled{opacity:.5;cursor:default}
#msg{margin-top:14px;min-height:1.4em;font-size:.95rem}
.ok{color:var(--ok)} .err{color:var(--bad)}
.hidden{display:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← Status bot</a><span id="who"></span></nav>

  <!-- LOGIN -->
  <section id="login">
    <h1>Masuk</h1>
    <p class="sub">Khusus pemilik bot.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">Masuk</button>
    </form>
  </section>

  <!-- PANEL -->
  <section id="panel" class="hidden">
    <h1>Setting bot</h1>
    <p class="sub">Perubahan dipakai bot dalam sekitar 15 detik.</p>
    <form id="cfgForm">
      <label for="prefix">Prefix command</label>
      <input id="prefix" type="text" maxlength="3" required pattern="\S{1,3}">
      <p class="hint">1 sampai 3 karakter, tanpa spasi.</p>

      <div class="row" style="margin-top:20px">
        <label for="ai">Kimi (AI) aktif</label>
        <input id="ai" type="checkbox">
      </div>

      <label for="rpm">Batas request AI per menit</label>
      <input id="rpm" type="number" min="1" max="200" required>

      <label for="activity">Status bot</label>
      <input id="activity" type="text" maxlength="128">
      <p class="hint">Teks yang tampil di profil bot. Kosongkan untuk menghapus.</p>

      <label for="prompt">Prompt Kimi</label>
      <textarea id="prompt" maxlength="6000"></textarea>
      <p class="hint">Kosong = pakai prompt bawaan. Percakapan yang sedang jalan di-reset saat prompt berubah.</p>

      <button id="saveBtn" type="submit">Simpan</button>
      <button id="logoutBtn" type="button" class="ghost" style="margin-left:8px">Keluar</button>
    </form>
  </section>

  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ PENGATURAN ============ */
const SUPABASE_URL = "https://kgupwuinbzlehopvvntu.supabase.co";
const SUPABASE_KEY = "sb_publishable_It2zKEHriV_E_tDAUFoG4Q_gKU_tSRu";   // publishable/anon key SAJA. Jangan secret key!
/* ===================================== */

const $ = id => document.getElementById(id);
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function say(text, cls){ $("msg").textContent = text || ""; $("msg").className = cls || ""; }

function show(loggedIn, email){
  $("login").classList.toggle("hidden", loggedIn);
  $("panel").classList.toggle("hidden", !loggedIn);
  $("who").textContent = loggedIn ? email : "";
}

async function loadConfig(){
  const { data, error } = await db.from("bot_config").select("*").eq("id", 1).maybeSingle();
  if (error || !data){
    say("Tidak bisa membaca setting. Pastikan email akunmu sama dengan yang ada di SQL.", "err");
    return;
  }
  $("prefix").value = data.prefix;
  $("ai").checked = data.ai_enabled;
  $("rpm").value = data.max_rpm;
  $("activity").value = data.activity;
  $("prompt").value = data.system_prompt;
  say("");
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginBtn").disabled = true; say("Memeriksa…");
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  $("loginBtn").disabled = false;
  if (error){ say("Email atau password salah.", "err"); return; }
  $("pass").value = ""; say("");
});

$("cfgForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("saveBtn").disabled = true; say("Menyimpan…");
  const { data, error } = await db.from("bot_config").update({
    prefix: $("prefix").value,
    ai_enabled: $("ai").checked,
    max_rpm: parseInt($("rpm").value, 10),
    activity: $("activity").value.trim(),
    system_prompt: $("prompt").value.trim(),
    updated_at: new Date().toISOString()
  }).eq("id", 1).select();
  $("saveBtn").disabled = false;
  if (error) say("Gagal menyimpan: " + error.message, "err");
  else if (!data || !data.length) say("Ditolak: akun ini tidak punya izin mengubah setting.", "err");
  else say("Tersimpan. Bot akan memakainya dalam sekitar 15 detik.", "ok");
});

$("logoutBtn").addEventListener("click", () => db.auth.signOut());

db.auth.onAuthStateChange((_evt, session) => {
  show(!!session, session?.user?.email);
  if (session) setTimeout(loadConfig, 0);   // hindari memanggil Supabase di dalam callback ini
});
db.auth.getSession().then(({ data }) => { if (!data.session) show(false); });
</script>
</body>
</html>
